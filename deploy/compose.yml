name: codex-usage-monitor
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: codex_usage
      POSTGRES_USER: usage_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?required}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=24"]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [database]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage_owner -d codex_usage"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: ${USAGE_IMAGE:-codex-usage-monitor:0.3.0}
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://usage_app:${APP_DB_PASSWORD:?required}@db:5432/codex_usage
    ports: ["127.0.0.1:8190:8080"]
    depends_on:
      db: {condition: service_healthy}
    networks: [database, edge]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  database:
    internal: true
  edge:
    driver: bridge
volumes:
  pgdata:
