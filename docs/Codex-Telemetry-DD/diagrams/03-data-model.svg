<rect width="1680" height="1120" fill="#f8fbfd"/><text x="45" y="60" class="title" text-anchor="start">核心数据实体关系</text><text x="45" y="102" class="sub" text-anchor="start">完整业务键包含 tenant_id  |  设备身份不进入跨设备日志去重键</text><polyline points="480,265 625,265" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="246" class="edge" text-anchor="start">1 对多</text><polyline points="270,360 270,440 1360,440 1360,410" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="660" y="424" class="edge" text-anchor="start">租户隔离贯穿全部业务键</text><polyline points="1055,265 1165,265" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1067" y="245" class="edge" text-anchor="start">归属设备</text><polyline points="1395,410 1395,470 430,470 430,530" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="630" y="505" class="edge" text-anchor="start">一条流有多个检查点</text><polyline points="1395,470 1260,470 1260,530" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="760,690 870,690" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="772" y="670" class="edge" text-anchor="start">相邻相减</text><rect x="55" y="170" width="425" height="190" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="77" y="207" class="node-title" text-anchor="start">tenants</text><text x="77" y="247" class="body" text-anchor="start">id PK</text><text x="77" y="276" class="body" text-anchor="start">timezone</text><text x="77" y="305" class="body" text-anchor="start">统计空间与默认查询时区</text><rect x="625" y="170" width="430" height="190" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="647" y="207" class="node-title" text-anchor="start">devices</text><text x="647" y="247" class="body" text-anchor="start">tenant_id + id PK</text><text x="647" y="276" class="body" text-anchor="start">status / last_seen_at</text><text x="647" y="305" class="body" text-anchor="start">写入凭据绑定登记设备</text><rect x="1165" y="170" width="460" height="240" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="1187" y="207" class="node-title" text-anchor="start">streams</text><text x="1187" y="247" class="body" text-anchor="start">tenant_id + stream_id + epoch PK</text><text x="1187" y="276" class="body" text-anchor="start">owner_device_id / anchor_id</text><text x="1187" y="305" class="body" text-anchor="start">durable_through / processed_through</text><text x="1187" y="334" class="body" text-anchor="start">quality / baseline_reason</text><rect x="55" y="530" width="705" height="310" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="77" y="567" class="node-title" text-anchor="start">usage_events 原始事实</text><text x="77" y="607" class="body" text-anchor="start">流业务键 + source_seq PK</text><text x="77" y="636" class="body" text-anchor="start">event_id 租户内唯一 / semantic_hash</text><text x="77" y="665" class="body" text-anchor="start">event_time / observed_at / received_at</text><text x="77" y="694" class="body" text-anchor="start">四项累计计数 / model / parser_version</text><text x="77" y="723" class="body" text-anchor="start">同键异值拒绝覆盖</text><rect x="870" y="530" width="755" height="310" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="892" y="567" class="node-title" text-anchor="start">usage_deltas 派生事实</text><text x="892" y="607" class="body" text-anchor="start">流业务键 + source_seq PK 和 FK</text><text x="892" y="636" class="body" text-anchor="start">event_time / model / calculation_version</text><text x="892" y="665" class="body" text-anchor="start">四项增量 / total_tokens</text><text x="892" y="694" class="body" text-anchor="start">来源为同一流的相邻有效检查点</text><text x="892" y="723" class="body" text-anchor="start">窗口查询 tenant_id + event_time 索引</text><rect x="55" y="900" width="1570" height="130" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="77" y="937" class="node-title" text-anchor="start">辅助审计与后续汇总</text><text x="77" y="977" class="body" text-anchor="start">ingest_conflicts 保存冲突摘要；usage_minute 仅在性能验证后增加，始终可由账本重建。</text>
