<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-label="采集与上报时序">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#416b88"/></marker></defs><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173046}
.title{font-size:36px;font-weight:700}.sub{font-size:21px;fill:#547084}
.zone{font-size:25px;font-weight:700}.node-title{font-size:23px;font-weight:700}
.body{font-size:20px}.small{font-size:18px;fill:#547084}.edge{font-size:18px;fill:#31566e}
.code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:19px}
</style>
<rect width="1680" height="1180" fill="#f8fbfd"/><text x="45" y="60" class="title" text-anchor="start">采集与上报时序</text><text x="45" y="102" class="sub" text-anchor="start">至少一次传输  |  事件级幂等  |  本地与服务端各自的事务边界</text><rect x="15" y="150" width="230" height="62" rx="12" fill="#e4eef7" stroke="#8ba8bd"/><text x="130" y="190" class="node-title" text-anchor="middle">源日志</text><line x1="130" y1="215" x2="130" y2="940" stroke="#b7cbd8" stroke-width="2" stroke-dasharray="6 6"/><rect x="345" y="150" width="230" height="62" rx="12" fill="#e4eef7" stroke="#8ba8bd"/><text x="460" y="190" class="node-title" text-anchor="middle">采集器</text><line x1="460" y1="215" x2="460" y2="940" stroke="#b7cbd8" stroke-width="2" stroke-dasharray="6 6"/><rect x="675" y="150" width="230" height="62" rx="12" fill="#e4eef7" stroke="#8ba8bd"/><text x="790" y="190" class="node-title" text-anchor="middle">本地 SQLite</text><line x1="790" y1="215" x2="790" y2="940" stroke="#b7cbd8" stroke-width="2" stroke-dasharray="6 6"/><rect x="1005" y="150" width="230" height="62" rx="12" fill="#e4eef7" stroke="#8ba8bd"/><text x="1120" y="190" class="node-title" text-anchor="middle">远端 API</text><line x1="1120" y1="215" x2="1120" y2="940" stroke="#b7cbd8" stroke-width="2" stroke-dasharray="6 6"/><rect x="1365" y="150" width="230" height="62" rx="12" fill="#e4eef7" stroke="#8ba8bd"/><text x="1480" y="190" class="node-title" text-anchor="middle">PostgreSQL</text><line x1="1480" y1="215" x2="1480" y2="940" stroke="#b7cbd8" stroke-width="2" stroke-dasharray="6 6"/><polyline points="130,270 460,270" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="195.0" y="254" class="edge" text-anchor="start">1 读取闭合的用量记录</text><polyline points="460,360 790,360" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525.0" y="344" class="edge" text-anchor="start">2 事务保存记录和游标</text><polyline points="790,430 460,430" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="525.0" y="414" class="edge" text-anchor="start">3 本地提交成功</text><polyline points="460,520 1120,520" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="690.0" y="504" class="edge" text-anchor="start">4 POST 批次 可重复发送</text><polyline points="1120,600 1480,600" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1200.0" y="584" class="edge" text-anchor="start">5 锁定流并判重入库</text><polyline points="1480,645 1580,645 1580,710 1480,710" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1190" y="680" class="edge" text-anchor="start">6 连续归并并派生增量</text><polyline points="1480,770 1120,770" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1200.0" y="754" class="edge" text-anchor="start">7 COMMIT 后确认</text><polyline points="1120,840 460,840" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="690.0" y="824" class="edge" text-anchor="start">8 返回持久与处理水位</text><polyline points="460,910 790,910" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525.0" y="894" class="edge" text-anchor="start">9 标记本地记录已确认</text><rect x="55" y="980" width="1570" height="115" rx="14" fill="#fff5e6" stroke="#d4b37b"/><text x="80" y="1018" class="body" text-anchor="start">应答丢失时重发相同业务键；服务器判重后返回成功，不再次累计。</text><text x="80" y="1056" class="body" text-anchor="start">乱序记录可先持久保存；缺少前序检查点时暂停派生，200 不等于已计入报表。</text>
<text x="45" y="1148" class="small" text-anchor="start">Codex Token 遥测统计  |  DD 0.1  |  2026-10-25  |  设计方案 未部署</text>
</svg>