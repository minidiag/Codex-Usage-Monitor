<rect width="1680" height="1100" fill="#f8fbfd"/><text x="45" y="60" class="title" text-anchor="start">部署与信任边界</text><text x="45" y="102" class="sub" text-anchor="start">单机服务端起步  |  私有数据库  |  用户态采集  |  独立备份</text><rect x="40" y="160" width="470" height="620" rx="22" fill="#edf4fb" stroke="#ccdce8" stroke-width="2"/><text x="64" y="200" class="zone" text-anchor="start">每台 Windows 用户设备</text><rect x="550" y="160" width="240" height="620" rx="22" fill="#fff5e6" stroke="#ccdce8" stroke-width="2"/><text x="574" y="200" class="zone" text-anchor="start">网络边界</text><rect x="830" y="160" width="810" height="620" rx="22" fill="#edf4fb" stroke="#ccdce8" stroke-width="2"/><text x="854" y="200" class="zone" text-anchor="start">用户自控 Linux 主机</text><polyline points="465,340 530,340 530,300 880,300" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="280" class="edge" text-anchor="start">HTTPS 443</text><polyline points="465,625 810,625 810,325 880,325" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="580" y="603" class="edge" text-anchor="start">只读查询</text><polyline points="1035,365 1035,430" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1050" y="403" class="edge" text-anchor="start">内部 HTTP</text><polyline points="1215,505 1250,505" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1580,505 1610,505 1610,800 1410,800 1410,840" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1430" y="787" class="edge" text-anchor="start">加密备份</text><rect x="85" y="260" width="380" height="175" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="107" y="297" class="node-title" text-anchor="start">后台 Collector</text><text x="107" y="337" class="body" text-anchor="start">用户登录后运行</text><text x="107" y="366" class="body" text-anchor="start">SQLite 队列与状态</text><text x="107" y="395" class="body" text-anchor="start">只写遥测凭据</text><rect x="85" y="540" width="380" height="150" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="107" y="577" class="node-title" text-anchor="start">Monitor 与可选网页</text><text x="107" y="617" class="body" text-anchor="start">只读统计凭据</text><text x="107" y="646" class="body" text-anchor="start">缓存与离线状态</text><text x="577" y="405" class="body" text-anchor="start">公网仅开放</text><text x="595" y="441" class="node-title" text-anchor="start">443</text><text x="572" y="485" class="small" text-anchor="start">不暴露数据库</text><rect x="880" y="250" width="700" height="115" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="902" y="287" class="node-title" text-anchor="start">TLS 网关</text><text x="902" y="327" class="body" text-anchor="start">证书校验 请求限制 访问日志脱敏</text><rect x="880" y="430" width="335" height="160" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="902" y="467" class="node-title" text-anchor="start">API 与流处理</text><text x="902" y="507" class="body" text-anchor="start">单副本起步</text><text x="902" y="536" class="body" text-anchor="start">按流事务锁定</text><text x="902" y="565" class="body" text-anchor="start">可扩展至多副本</text><rect x="1250" y="430" width="330" height="160" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="1272" y="467" class="node-title" text-anchor="start">PostgreSQL</text><text x="1272" y="507" class="body" text-anchor="start">私有网络与数据卷</text><text x="1272" y="536" class="body" text-anchor="start">幂等键和增量事实</text><text x="1272" y="565" class="body" text-anchor="start">事务提交后应答</text><rect x="880" y="650" width="700" height="100" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="902" y="687" class="node-title" text-anchor="start">运行监控</text><text x="902" y="727" class="body" text-anchor="start">队列 缺口 冲突 延迟 磁盘与备份状态</text><rect x="830" y="840" width="810" height="175" rx="22" fill="#edf7f3" stroke="#ccdce8" stroke-width="2"/><text x="854" y="880" class="zone" text-anchor="start">独立备份位置</text><text x="857" y="925" class="body" text-anchor="start">每日备份 需要时归档 WAL 定期执行恢复演练</text><text x="857" y="966" class="small" text-anchor="start">恢复后通过本地保留记录或源日志重放核对</text><text x="65" y="875" class="sub" text-anchor="start">首版无需 Kafka Redis 或 Kubernetes</text><text x="65" y="920" class="small" text-anchor="start">部署目标和保留策略由用户确认后锁定</text>
