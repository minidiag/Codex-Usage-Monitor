text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173046}
.title{font-size:36px;font-weight:700}.sub{font-size:21px;fill:#547084}
.zone{font-size:25px;font-weight:700}.node-title{font-size:23px;font-weight:700}
