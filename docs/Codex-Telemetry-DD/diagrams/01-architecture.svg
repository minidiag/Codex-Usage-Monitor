<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-label="总体架构">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#416b88"/></marker></defs><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173046}
.title{font-size:36px;font-weight:700}.sub{font-size:21px;fill:#547084}
.zone{font-size:25px;font-weight:700}.node-title{font-size:23px;font-weight:700}
.body{font-size:20px}.small{font-size:18px;fill:#547084}.edge{font-size:18px;fill:#31566e}
.code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:19px}
</style>
<rect width="1680" height="1120" fill="#f8fbfd"/><text x="45" y="60" class="title" text-anchor="start">总体架构</text><text x="45" y="102" class="sub" text-anchor="start">个人和多设备统计空间  |  原始用量保持本地  |  服务器保存可重建的统计账本</text><rect x="40" y="140" width="740" height="810" rx="22" fill="#edf4fb" stroke="#ccdce8" stroke-width="2"/><text x="64" y="180" class="zone" text-anchor="start">Windows 用户侧</text><rect x="820" y="140" width="820" height="810" rx="22" fill="#edf4fb" stroke="#ccdce8" stroke-width="2"/><text x="844" y="180" class="zone" text-anchor="start">远端统计服务</text><polyline points="380,294 420,294" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="575,370 575,440" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="586" y="407" class="edge" text-anchor="start">规范化累计检查点</text><polyline points="420,525 380,525" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="575,610 575,680" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="654" class="edge" text-anchor="start">提交后发送</text><polyline points="730,755 794,755 794,275 880,275" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="810" y="382" class="edge" text-anchor="start">HTTPS 批量上传</text><polyline points="1050,340 1050,410" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1070" y="382" class="edge" text-anchor="start">验证与顺序处理</text><polyline points="1200,490 1240,490" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1410,580 1410,630 1220,630 1220,680" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1250" y="656" class="edge" text-anchor="start">精确增量事实</text><polyline points="880,785 804,785 804,900 230,900 230,830" fill="none" stroke="#416b88" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="420" y="883" class="edge" text-anchor="start">服务器确认值与覆盖状态</text><rect x="80" y="210" width="300" height="160" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="102" y="247" class="node-title" text-anchor="start">本地用量来源</text><text x="102" y="287" class="body" text-anchor="start">sessions / archived</text><text x="102" y="316" class="body" text-anchor="start">完整记录与事件时间</text><text x="102" y="345" class="body" text-anchor="start">只读访问 不读取凭据</text><rect x="420" y="210" width="310" height="160" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="442" y="247" class="node-title" text-anchor="start">来源适配器</text><text x="442" y="287" class="body" text-anchor="start">解析累计计数与继承基线</text><text x="442" y="316" class="body" text-anchor="start">稳定流身份和逻辑序号</text><text x="442" y="345" class="body" text-anchor="start">识别未知格式与异常</text><rect x="80" y="440" width="300" height="170" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="102" y="477" class="node-title" text-anchor="start">SQLite 游标与状态</text><text x="102" y="517" class="body" text-anchor="start">文件位置与来源身份</text><text x="102" y="546" class="body" text-anchor="start">完整行处理后的游标</text><text x="102" y="575" class="body" text-anchor="start">与 Outbox 原子提交</text><rect x="420" y="440" width="310" height="170" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="442" y="477" class="node-title" text-anchor="start">SQLite Outbox</text><text x="442" y="517" class="body" text-anchor="start">不可变上报记录</text><text x="442" y="546" class="body" text-anchor="start">断网持久排队与重传</text><text x="442" y="575" class="body" text-anchor="start">收到持久确认后清理</text><rect x="420" y="680" width="310" height="150" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="442" y="717" class="node-title" text-anchor="start">后台上传器</text><text x="442" y="757" class="body" text-anchor="start">每批不超过 500 条</text><text x="442" y="786" class="body" text-anchor="start">退避重试与凭据管理</text><rect x="80" y="680" width="300" height="150" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="102" y="717" class="node-title" text-anchor="start">Monitor 悬浮窗</text><text x="102" y="757" class="body" text-anchor="start">四窗口固定 Token 统计</text><text x="102" y="786" class="body" text-anchor="start">任务和额度独立展示</text><rect x="880" y="210" width="700" height="130" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="902" y="247" class="node-title" text-anchor="start">认证与接收 API</text><text x="902" y="287" class="body" text-anchor="start">请求白名单 校验大小 租户隔离 事件级幂等</text><rect x="880" y="410" width="320" height="170" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="902" y="447" class="node-title" text-anchor="start">顺序归并模块</text><text x="902" y="487" class="body" text-anchor="start">按流锁定并处理连续序号</text><text x="902" y="516" class="body" text-anchor="start">累计检查点相减生成增量</text><text x="902" y="545" class="body" text-anchor="start">缺段或回退暂停派生</text><rect x="1240" y="410" width="340" height="170" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="1262" y="447" class="node-title" text-anchor="start">PostgreSQL 账本</text><text x="1262" y="487" class="body" text-anchor="start">原始检查点和精确增量</text><text x="1262" y="516" class="body" text-anchor="start">唯一约束与事务提交</text><text x="1262" y="545" class="body" text-anchor="start">状态水位和质量原因</text><rect x="880" y="680" width="700" height="150" rx="14" fill="#ffffff" stroke="#8ba8bd" stroke-width="2"/><text x="902" y="717" class="node-title" text-anchor="start">窗口查询 API</text><text x="902" y="757" class="body" text-anchor="start">最近 5 小时 今日 本周 本月</text><text x="902" y="786" class="body" text-anchor="start">统一查询时刻 北京时间边界 不按接收时间归档</text><text x="65" y="997" class="sub" text-anchor="start">上传数值与必要标识；不上传正文、标题、路径或 Codex 登录凭据。</text><text x="65" y="1035" class="sub" text-anchor="start">客户端负责采集与可靠传输；服务器负责去重、增量计算和周期累计。</text>
<text x="45" y="1088" class="small" text-anchor="start">Codex Token 遥测统计  |  DD 0.1  |  2026-10-25  |  设计方案 未部署</text>
</svg>